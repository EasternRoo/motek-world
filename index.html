<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#281e13">
<title>Motek World — Just a kangaroo. Allegedly.</title>
<meta name="description" content="Enter Motek World. Meet the roo, play Carrot Chaos, discover secrets and join the mob.">
<style>
:root{color-scheme:dark;--cream:#fff3d6;--wood:#6d3e1d;--gold:#ffc56b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#25190f;color:var(--cream);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}.scene{position:relative;width:100%;aspect-ratio:16/9;background:#624328 url('assets/motek-desktop.png') center /100% 100% no-repeat;overflow:hidden}.hotspot{position:absolute;display:flex;justify-content:center;align-items:center;text-align:center;border:0;background:transparent;color:#241406;font-weight:1000;letter-spacing:.035em;text-shadow:0 1px 1px #f8c17d;padding:.3em;line-height:1.05;transition:transform .18s,filter .18s;transform:translate(-50%,-50%);font-size:clamp(11px,1.55vw,27px)}.hotspot:hover,.hotspot:focus-visible{transform:translate(-50%,-50%) scale(1.07);filter:brightness(1.2)}.hotspot.main{left:49.5%;top:15%;width:37%;height:17%;font-size:clamp(17px,2.8vw,52px);text-shadow:0 2px 1px #ffdb9d}.hotspot.about{left:15%;top:22%;width:17%;height:10%}.hotspot.mob{left:15%;top:37%;width:17%;height:10%}.hotspot.game{left:15%;top:52%;width:18%;height:11%}.hotspot.files{left:83%;top:24%;width:19%;height:12%}.hotspot.secrets{left:83%;top:39%;width:19%;height:12%}.hotspot.daily{left:83%;top:53%;width:19%;height:12%}.footer{text-align:center;padding:16px 12px 24px;background:#25190f;font-size:13px;color:#ead3ae}.footer a{color:var(--gold)}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(17,10,5,.78);padding:18px;backdrop-filter:blur(9px)}.panel{position:relative;width:min(620px,100%);max-height:90dvh;overflow:auto;border:2px solid #c28a4e;border-radius:22px;padding:28px;background:linear-gradient(145deg,#50351c,#25190f 85%);box-shadow:0 24px 80px #0009, inset 0 0 35px #ad72352a}.panel h2{font-size:clamp(25px,4vw,39px);line-height:1.1;margin:2px 42px 16px 0;color:#ffd88b}.panel p{line-height:1.65}.close{position:absolute;right:14px;top:12px;border:1px solid #b38b60;border-radius:50%;width:40px;height:40px;background:#302012;color:white;font-size:26px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.action{border:1px solid #e0b77b;border-radius:12px;background:#e6a94c;color:#28190a;padding:11px 15px;font-weight:800;text-decoration:none}.action.secondary{background:#3c2816;color:#ffe6bb}.muted{color:#d6b893}.board{background:#1e160e;border:1px solid #9c794a;border-radius:13px;padding:12px;margin-top:14px}.game-wrap{position:relative;width:100%;max-width:450px;margin:auto}.game-wrap canvas{display:block;width:100%;height:auto;border:3px solid #9a6b34;border-radius:13px;background:#bde6f6;touch-action:none}.game-score{display:flex;justify-content:space-between;font-weight:800;margin:8px 0}.tiny{font-size:13px}.spark{font-size:58px;text-align:center;filter:drop-shadow(0 5px 4px #0007)}@media(max-width:700px){.scene{aspect-ratio:9/16;background-image:url('assets/motek-mobile.png')}.hotspot{font-size:clamp(12px,3.1vw,21px)}.hotspot.main{left:50%;top:14%;width:68%;height:13%;font-size:clamp(17px,5vw,31px)}.hotspot.about{left:14%;top:31%;width:24%;height:9%}.hotspot.mob{left:14%;top:40%;width:24%;height:9%}.hotspot.game{left:14%;top:49%;width:24%;height:9%}.hotspot.files{left:85%;top:31%;width:25%;height:9%}.hotspot.secrets{left:85%;top:40%;width:25%;height:9%}.hotspot.daily{left:85%;top:49%;width:25%;height:9%}.panel{padding:22px}.scene .hotspot:not(.main){font-size:clamp(9px,2.65vw,16px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene" aria-label="Motek World interactive map">
<button class="hotspot main" data-open="world">ENTER<br>MOTEK WORLD</button>
<button class="hotspot about" data-open="about">WHO TF<br>IS MOTEK?</button>
<button class="hotspot mob" data-open="mob">JOIN<br>THE MOB</button>
<button class="hotspot game" data-open="game">CARROT<br>CHAOS</button>
<button class="hotspot files" data-open="files">ROO<br>FILES</button>
<button class="hotspot secrets" data-open="secrets">ROO<br>SECRETS</button>
<button class="hotspot daily" data-open="daily">DAILY<br>CARROT</button>
</main>
<footer class="footer">just a kangaroo. allegedly. · <a href="https://x.com/motekirl" target="_blank" rel="noopener noreferrer">@motekirl on X</a></footer>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
<div class="panel"><button class="close" id="close" aria-label="Close">×</button><h2 id="modal-title"></h2><div id="content"></div></div>
</div>
<script>
(()=>{'use strict';
const x='https://x.com/motekirl';const modal=document.querySelector('#modal'),title=document.querySelector('#modal-title'),content=document.querySelector('#content'),close=document.querySelector('#close');let lastFocus=null,game=null;
const link=(url,label)=>`<a class="action" target="_blank" rel="noopener noreferrer" href="${url}">${label}</a>`;
const share=(msg)=>`https://twitter.com/intent/tweet?text=${encodeURIComponent(msg)}&url=${encodeURIComponent('https://easternroo.github.io/motek-world/')}`;
const carrotQuotes=["Your portfolio needs water. I brought a carrot.","BREAKING: local kangaroo refuses to elaborate.","I came. I hopped. I forgot why.","Zero thoughts. Maximum hop.","A carrot a day keeps the bears confused.","Proof of hop > proof of work.","Officially approved by absolutely no one."];
const views={
world:['WELCOME TO MOTEK WORLD',`<div class="spark">🦘</div><p>You're in. This is Motek's corner of the internet. Explore the signs, meet the roo, find secrets, and collect carrots.</p><div class="actions"><button class="action" data-next="game">PLAY CARROT CHAOS</button><button class="action secondary" data-next="secrets">FIND A SECRET</button></div>`],
about:['WHO TF IS MOTEK?',`<p>Just a kangaroo. Allegedly.</p><p>Motek is our little roo from the real world, now causing trouble on Animal Twitter. Big ears. Small paws. Highly suspicious internet activity.</p><div class="actions">${link(x,'MEET HIM ON X')}</div>`],
mob:['JOIN THE MOB',`<p>The mob is the community around Motek. Join the conversations, drop your memes, and make some noise.</p><div class="actions">${link(x,'VISIT @MOTEKIRL')}</div><p class="muted tiny">Community features are coming later. No account or wallet required to explore.</p>`],
files:['ROO FILES',`<p>Classified kangaroo material. Photos, memes and videos will live here.</p><div class="board">📸 First collection: COMING SOON</div><div class="actions">${link(x,'SEE THE LATEST ON X')}</div>`],
secrets:['ROO SECRETS',`<p>Some secrets are hiding in plain sight.</p><div class="board" id="secret-text">???</div><div class="actions"><button class="action" id="reveal">REVEAL SECRET</button></div>`],
daily:['DAILY CARROT',`<div class="spark">🥕</div><p>One fresh bit of kangaroo wisdom per day. Same carrot for everyone on this device today.</p><div class="board" id="daily-text"></div><div class="actions"><a class="action" id="share-daily" target="_blank" rel="noopener noreferrer">SHARE ON X</a></div>`],
game:['CARROT CHAOS',`<p class="tiny">Move the kangaroo with your mouse, finger or ← → keys. Catch the carrots. Avoid the rocks!</p><div class="game-score"><span id="score">CARROTS: 0</span><span id="time">TIME: 30</span></div><div class="game-wrap"><canvas id="game-canvas" width="450" height="420" aria-label="Carrot catching game"></canvas></div><div class="actions"><button class="action" id="start-game">START / RESTART</button><a class="action secondary" id="share-score" target="_blank" rel="noopener noreferrer">SHARE SCORE</a></div>`]
};
function stopGame(){if(game?.raf)cancelAnimationFrame(game.raf);game=null}
function openView(name){if(!views[name])return;stopGame();lastFocus=document.activeElement;title.textContent=views[name][0];content.innerHTML=views[name][1];modal.hidden=false;document.body.style.overflow='hidden';close.focus();if(name==='daily')daily();if(name==='secrets')secrets();if(name==='game')prepareGame()}
function shut(){stopGame();modal.hidden=true;document.body.style.overflow='';lastFocus?.focus()}
document.addEventListener('click',e=>{const target=e.target.closest('[data-open],[data-next]');if(target)openView(target.dataset.open||target.dataset.next)});close.addEventListener('click',shut);modal.addEventListener('click',e=>{if(e.target===modal)shut()});document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')shut();if(e.key==='Tab'){const focusable=[...modal.querySelectorAll('button,a[href]')].filter(el=>el.getClientRects().length);if(!focusable.length)return;let i=focusable.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&i===focusable.length-1){e.preventDefault();focusable[0].focus()}}});
function dateKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function daily(){const day=dateKey();let hash=0;for(const c of day)hash=(hash*31+c.charCodeAt(0))>>>0;const quote=carrotQuotes[hash%carrotQuotes.length];document.querySelector('#daily-text').textContent=quote;document.querySelector('#share-daily').href=share(`🥕 Daily Carrot from @motekirl: ${quote}`)}
function secrets(){const messages=['Secret #001: The carrots know everything.','Secret #002: Motek is definitely not running this website.','Secret #003: If you can read this, you are now part of the mob.','Secret #004: The ears are receiving a signal.'];let step=0;document.querySelector('#reveal').onclick=()=>{document.querySelector('#secret-text').textContent=messages[step++%messages.length]}}
function prepareGame(){const canvas=document.querySelector('#game-canvas'),ctx=canvas.getContext('2d');if(!ctx)return;const start=document.querySelector('#start-game');let px=225,keys={left:false,right:false};const draw=(items=[],score=0,time=30)=>{const w=450,h=420;ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#94d8ff');sky.addColorStop(1,'#e2edbc');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#81b857';ctx.fillRect(0,350,w,70);ctx.font='44px system-ui';ctx.textAlign='center';ctx.fillText('🦘',px,356);for(const it of items){ctx.font='34px system-ui';ctx.fillText(it.bad?'🪨':'🥕',it.x,it.y)}ctx.fillStyle='#25391a';ctx.textAlign='left';ctx.font='bold 17px system-ui';ctx.fillText('MOTEK WORLD',12,26)};draw();
const move=e=>{const rect=canvas.getBoundingClientRect();px=Math.max(27,Math.min(423,(e.clientX-rect.left)*450/rect.width));if(!game)draw()};canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',move);window.onkeydown=e=>{if(modal.hidden||!game)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();keys[e.key==='ArrowLeft'?'left':'right']=true}};window.onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys[e.key==='ArrowLeft'?'left':'right']=false};
start.onclick=()=>{stopGame();let score=0,items=[],last=performance.now(),remaining=30,spawn=0;game={raf:0};const thisGame=game;document.querySelector('#share-score').href=share('I just played Carrot Chaos in Motek World 🥕');const tick=now=>{if(game!==thisGame)return;const dt=Math.min((now-last)/1000,.05);last=now;remaining=Math.max(0,remaining-dt);spawn+=dt;if(keys.left)px=Math.max(27,px-350*dt);if(keys.right)px=Math.min(423,px+350*dt);if(spawn>.55){spawn=0;items.push({x:25+Math.random()*400,y:-20,bad:Math.random()<.23})}for(const item of items){item.y+=175*dt;if(item.y>315&&item.y<368&&Math.abs(item.x-px)<38&&!item.hit){item.hit=true;score+=item.bad?-2:1;score=Math.max(0,score)}}items=items.filter(it=>it.y<440&&!it.hit);draw(items,score,remaining);document.querySelector('#score').textContent=`CARROTS: ${score}`;document.querySelector('#time').textContent=`TIME: ${Math.ceil(remaining)}`;if(remaining>0)thisGame.raf=requestAnimationFrame(tick);else{game=null;ctx.fillStyle='#1d160bdc';ctx.fillRect(55,145,340,90);ctx.textAlign='center';ctx.fillStyle='#ffe7ac';ctx.font='bold 28px system-ui';ctx.fillText(`FINAL SCORE: ${score}`,225,199);document.querySelector('#share-score').href=share(`I scored ${score} in Carrot Chaos 🥕 Can you beat me? @motekirl`)}};thisGame.raf=requestAnimationFrame(tick)};
}
})();
</script>
</body>
</html>
